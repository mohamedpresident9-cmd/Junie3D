[package]
name = "junie3d"
version = "0.1.0"
edition = "2024"
authors = ["Junie <junie@jetbrains.com>"]
description = "A Blender-like 3D creation application built in Rust"
license = "MIT"

[dependencies]
# UI framework
egui = "0.28"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "persistence", "glow"] }

# GPU rendering
wgpu = "0.20"

# Math library
glam = { version = "0.28", features = ["serde"] }

# Random numbers
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# 3D file formats
tobj = "4.0"
gltf = "1.3"

# Async
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Logging
log = "0.4"
env_logger = "0.11"
