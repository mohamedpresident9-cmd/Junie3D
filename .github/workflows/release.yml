name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Build Inno Setup installer
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\junie3d.iss"
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            target/release/junie3d.exe
            installer/installer/windows/Junie3D-*-setup.exe

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxrandr-dev libxinerama-dev libxi-dev \
            libgl1-mesa-dev libasound2-dev libudev-dev

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Package Linux binary
        run: |
          mkdir -p dist
          cp target/release/junie3d dist/junie3d-linux-x86_64
          chmod +x dist/junie3d-linux-x86_64
          tar czf dist/junie3d-linux-x86_64.tar.gz -C dist junie3d-linux-x86_64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/junie3d-linux-x86_64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect all release assets
          assets=()
          
          # Windows files
          if [ -f "windows-build/junie3d.exe" ]; then
            assets+=("windows-build/junie3d.exe")
          fi
          for f in windows-build/Junie3D-*-setup.exe; do
            [ -f "$f" ] && assets+=("$f")
          done
          
          # Linux files
          if [ -f "linux-build/junie3d-linux-x86_64.tar.gz" ]; then
            assets+=("linux-build/junie3d-linux-x86_64.tar.gz")
          fi

          # Create release
          gh release create "v${GITHUB_REF#refs/tags/v}" \
            --title "Junie 3D Editor v${GITHUB_REF#refs/tags/v}" \
            --generate-notes \
            "${assets[@]}"
